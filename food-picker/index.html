<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="桃園吃什麼">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<title>桃園今天吃什麼？</title>
<style>
:root{--bg:#fff7ef;--card:#fff;--ink:#222;--muted:#777;--accent:#ff7447;--line:#eee;--green:#1a8f52;--red:#d94a4a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff8f0,#ffe9da);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink)}
.wrap{max-width:760px;margin:auto;padding:18px 14px 50px}.card{background:rgba(255,255,255,.96);border-radius:26px;padding:22px;box-shadow:0 12px 40px #00000014}
h1{font-size:34px;margin:0 0 5px}.sub{color:var(--muted);margin-bottom:20px}.result{min-height:155px;border:2px dashed #ffb48e;border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:#fffaf6}
.resultName{font-size:38px;font-weight:900;line-height:1.22}.meta{color:var(--muted);font-size:13px;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button,.btn{border:0;border-radius:15px;padding:14px;font-size:16px;font-weight:750;cursor:pointer}
.primary{background:var(--accent);color:#fff}.soft{background:#f4f4f4;color:#333}.danger{background:#fff0f0;color:var(--red)}
.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 10px}.row{display:flex;gap:8px;flex-wrap:wrap}
input,select{width:100%;border:1px solid #ddd;border-radius:13px;padding:12px;font-size:16px;background:#fff}
.form{display:grid;grid-template-columns:1fr auto;gap:8px}.list{display:flex;flex-direction:column;gap:8px;max-height:370px;overflow:auto}
.item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 11px;background:#fff}.itemName{flex:1;font-weight:650}.tag{font-size:12px;border-radius:999px;padding:5px 8px;background:#f1f1f1}.tag.off{background:#fff0f0;color:var(--red)}
.iconBtn{padding:7px 9px;border-radius:10px;background:#f4f4f4;font-size:14px}.small{font-size:12px;color:var(--muted);line-height:1.5}
.notice{background:#fff5dc;border-radius:14px;padding:12px;font-size:13px;line-height:1.55}
.history{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#f4f4f4;font-size:13px}
hr{border:0;border-top:1px solid #eee;margin:22px 0}
@media(max-width:560px){h1{font-size:29px}.resultName{font-size:32px}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.card{padding:18px}}
.installTip{display:none;margin:0 0 14px;background:#eef7ff;border:1px solid #cfe7ff;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.5}
.installTip strong{display:block;margin-bottom:3px}.installTip button{margin-top:8px;padding:8px 10px;font-size:13px}
@media (display-mode: standalone){.installTip{display:none!important}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div id="installTip" class="installTip"><strong>📱 加到 iPhone 主畫面</strong>用 Safari 開啟後，點底部「分享」→「加入主畫面」，之後就能像 App 一樣直接開。<button class="soft" onclick="document.getElementById('installTip').style.display='none'">知道了</button></div>
<h1>🍜 桃園今天吃什麼？</h1>
<div class="sub"><span id="count"></span> 家候選餐廳 · 清單會儲存在這台裝置</div>
<div class="result"><div><div class="resultName" id="result">按「幫我選」🎲</div><div class="meta" id="resultMeta"></div></div></div>
<div class="grid"><button class="primary" onclick="pick()">🎲 幫我選</button><button class="soft" onclick="pick()">🔁 再抽一次</button></div>
<div class="section"><h2>最近抽過</h2><div id="history" class="history"><span class="pill">尚未抽選</span></div></div>
<hr>
<div class="section"><h2>➕ 新增餐廳</h2><div class="form"><input id="newName" placeholder="例如：XX牛肉麵" onkeydown="if(event.key==='Enter')addRestaurant()"><button class="primary" onclick="addRestaurant()">新增</button></div></div>
<div class="section"><h2>📍 住家定位基準</h2><input id="homeAnchor" placeholder="例如：桃園火車站／某路口／附近地標"><div class="small" style="margin-top:6px">先存一個附近地標即可，不需要輸入完整門牌。之後可用來整理 2 km 內餐廳。</div><button class="soft" style="margin-top:8px;width:100%" onclick="saveHome()">儲存定位基準</button></div>
<div class="section"><h2>餐廳清單</h2><div class="row" style="margin-bottom:8px"><button class="soft" onclick="setAll(true)">全部啟用</button><button class="soft" onclick="exportList()">匯出清單</button><label class="btn soft">匯入清單<input type="file" accept=".json" style="display:none" onchange="importList(event)"></label></div><div class="notice">「停用」的餐廳不會被抽到。這版已支援新增／刪除／停用；即時「現在有沒有營業」若要完全自動判斷，需要串接 Apple/Google 地點資料來源，不能只靠離線 HTML 猜營業狀態。</div><div id="restaurantList" class="list" style="margin-top:10px"></div></div>
</div></div>
<script>
const DEFAULT = [{"name":"陸軍小館","active":true,"source":"original"},{"name":"千和牛肉麵","active":true,"source":"original"},{"name":"猛甲生魚片","active":true,"source":"original"},{"name":"秀綠披薩","active":true,"source":"original"},{"name":"巴方早餐","active":true,"source":"original"},{"name":"食席生","active":true,"source":"original"},{"name":"越芳越南牛肉河粉","active":true,"source":"original"},{"name":"楊記切仔麵","active":true,"source":"original"},{"name":"陳記滷肉飯","active":true,"source":"original"},{"name":"台灣鵝 客家鵝肉","active":true,"source":"original"},{"name":"海丼海鮮","active":true,"source":"original"},{"name":"霧夜","active":true,"source":"original"},{"name":"可薩橄欖油手作料理","active":true,"source":"original"},{"name":"油仔豬腳","active":true,"source":"original"},{"name":"壹品壹豬腳","active":true,"source":"original"},{"name":"品香殿","active":true,"source":"original"},{"name":"午夜市場塔可飯","active":true,"source":"original"},{"name":"南門市場（牛丼）牛肉燴飯","active":true,"source":"original"},{"name":"大鼎豬血湯","active":true,"source":"original"},{"name":"桃園夜市越南頭頓煎蝦餅","active":true,"source":"original"},{"name":"南門第一家廣東腸粉","active":true,"source":"original"},{"name":"水母餐酒館","active":true,"source":"original"},{"name":"湘門客棧","active":true,"source":"original"},{"name":"三冬拉麵","active":true,"source":"original"},{"name":"俺家拉麵","active":true,"source":"original"},{"name":"虎千代拉麵","active":true,"source":"original"},{"name":"森mori","active":true,"source":"original"},{"name":"無名拉麵","active":true,"source":"original"},{"name":"石田一龍","active":true,"source":"original"},{"name":"立浪拉麵","active":true,"source":"original"},{"name":"桂田拉麵","active":true,"source":"original"},{"name":"許諺屋","active":true,"source":"original"},{"name":"九福、六福包子","active":true,"source":"original"},{"name":"宋太太養生饅頭","active":true,"source":"original"},{"name":"江夏包子","active":true,"source":"original"}];
const KEY="taoyuanFoodV2",HOMEKEY="taoyuanFoodHome";let data=load(),history=[],last="";
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)&&v.length?v:structuredClone(DEFAULT)}catch(e){return structuredClone(DEFAULT)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function render(){document.getElementById("count").textContent=data.filter(x=>x.active!==false).length;const box=document.getElementById("restaurantList");box.innerHTML="";data.forEach((r,i)=>{const d=document.createElement("div");d.className="item";const t=document.createElement("span");t.className="tag "+(r.active===false?"off":"");t.textContent=r.active===false?"已停用":"候選";const n=document.createElement("div");n.className="itemName";n.textContent=r.name;const toggle=document.createElement("button");toggle.className="iconBtn";toggle.textContent=r.active===false?"啟用":"停用";toggle.onclick=()=>{data[i].active=r.active===false;save()};const del=document.createElement("button");del.className="iconBtn";del.textContent="刪除";del.onclick=()=>{if(confirm("刪除「"+r.name+"」？")){data.splice(i,1);save()}};d.append(t,n,toggle,del);box.appendChild(d)})}
function addRestaurant(){const el=document.getElementById("newName"),name=el.value.trim();if(!name)return;if(data.some(r=>r.name.toLowerCase()===name.toLowerCase())){alert("這家已經在清單裡");return}data.unshift({name,active:true,source:"user"});el.value="";save()}
function pick(){const pool=data.filter(x=>x.active!==false&&x.name!==last);if(!pool.length){document.getElementById("result").textContent="沒有可抽的餐廳";return}let ticks=0,res=document.getElementById("result");const timer=setInterval(()=>{const p=pool[Math.floor(Math.random()*pool.length)];res.textContent=p.name;ticks++;if(ticks>12){clearInterval(timer);const p=pool[Math.floor(Math.random()*pool.length)];res.textContent="👉 "+p.name;last=p.name;history.unshift(p.name);history=history.slice(0,5);document.getElementById("resultMeta").innerHTML='<a target="_blank" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.name+' 桃園')+'">在 Google Maps 查看</a>';document.getElementById("history").innerHTML=history.map(x=>'<span class="pill">'+escapeHtml(x)+'</span>').join("")}},65)}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function setAll(v){data.forEach(x=>x.active=v);save()}
function saveHome(){localStorage.setItem(HOMEKEY,document.getElementById("homeAnchor").value.trim());alert("已儲存")}
function exportList(){const payload={version:2,home:localStorage.getItem(HOMEKEY)||"",restaurants:data,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="桃園美食清單.json";a.click();URL.revokeObjectURL(a.href)}
function importList(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);const arr=Array.isArray(o)?o:o.restaurants;if(!Array.isArray(arr))throw new Error();data=arr.map(x=>typeof x==="string"?{name:x,active:true,source:"import"}:x).filter(x=>x.name);if(o.home){localStorage.setItem(HOMEKEY,o.home);document.getElementById("homeAnchor").value=o.home}save();alert("匯入完成")}catch(err){alert("清單格式不正確")}};rd.readAsText(f);e.target.value=""}
document.getElementById("homeAnchor").value=localStorage.getItem(HOMEKEY)||"";render();
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;if(isIOS&&!isStandalone){document.getElementById('installTip').style.display='block'}if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body></html>
